name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - prod
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: SonarQube Scan
        # El plan Free de SonarQube Cloud solo analiza la rama principal (dev)
        # y PRs cuya base sea esa rama - "Analyze feature branches" (staging/prod
        # como base) requiere plan Team, asi que se omite en esos casos.
        if: github.event_name == 'push' || github.base_ref == 'dev'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
