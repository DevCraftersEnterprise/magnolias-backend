sonar.projectKey=DevCraftersEnterprise_magnolias-backend
sonar.organization=devcraftersenterprise

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=magnolias-backend
#sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Las migraciones de TypeORM son código mecánico (SQL generado/manual), no se
# prueban unitariamente en este proyecto - se verifican ejecutándolas contra
# una base de datos real. Se excluyen de la métrica de cobertura para no
# distorsionar el ratio de "New Code" en PRs que agregan migraciones grandes.
#
# Las entidades (src/**/entities/**) son clases de datos puras (columnas y
# relaciones de TypeORM vía decoradores), sin lógica propia (confirmado: no
# hay ningún método declarado en ninguna entidad del proyecto). Los
# decoradores @ManyToOne/@OneToMany con resolvers de tipo en arrow function
# quedan marcados como "líneas a cubrir" por el instrumentador de Jest, pero
# solo se ejecutan vía la reflexión de metadatos de TypeORM, no en un test
# unitario normal - por eso NINGUNA entidad del proyecto llega al 100% (rango
# real: 77%-90%, confirmado revisando las ~25 entidades existentes). Se
# excluyen para no bloquear el Quality Gate de "New Code" cada vez que se
# agrega una entidad nueva por una limitación estructural, no por falta de
# pruebas.
#
# Los *.module.ts (wiring de NestJS/TypeORM vía decoradores, sin lógica) y
# los seeds (src/database/seeds/**, scripts de ejecución manual verificados
# corriéndolos contra una base real, igual que las migraciones) están en
# 0% de cobertura en TODO el proyecto, no solo en código nuevo - mismo caso
# que las migraciones.
#
# src/formats/reports/** (constructores de contenido para pdfmake) está al
# 0% de cobertura en TODO el proyecto desde antes de este cambio - se
# verifican generando el PDF real y revisándolo visualmente (ver checklist
# de verificación manual en cada tarea), no con pruebas unitarias; son
# árboles de definición declarativos de pdfmake, no lógica de negocio.
#
# Los *.controller.ts están al 0% de statements/funciones en TODO el
# proyecto desde antes de este cambio (confirmado: las 14 controllers
# existentes, no solo customers.controller.ts, dan 0% - ver PR #179).
# Son capas delgadas de ruteo (decoradores @Api*/@Get/@Post + delegación
# directa a un usecase, sin lógica propia) que se verifican con las
# pruebas unitarias exhaustivas de sus usecases y con QA manual/e2e, no
# con cobertura unitaria del controller. Se excluyen para no bloquear el
# Quality Gate cada vez que un PR solo agrega un @ApiQuery/@ApiProperty
# de Swagger a un endpoint existente.
sonar.coverage.exclusions=src/database/migrations/**,src/**/entities/**,src/**/*.module.ts,src/database/seeds/**,src/formats/reports/**,src/**/*.controller.ts

# Las entidades también quedan excluidas de la detección de duplicados: el
# patrón de columnas de auditoría (createdBy/updatedBy/createdAt/updatedAt +
# @ManyToOne a User) se repite, por diseño, en las ~25 entidades del
# proyecto (confirmado vía la API de duplicados de SonarCloud: cualquier
# entidad nueva duplica boilerplate ya presente en order-flower.entity.ts,
# order-assignment.entity.ts, branch.entity.ts, product.entity.ts, etc.).
# Unificarlo requeriría una entidad base/mixin compartida a través de TODO
# el proyecto - un refactor arquitectónico aparte, no algo a resolver de
# forma oportunista dentro de esta tarea.
sonar.cpd.exclusions=src/**/entities/**
